name: Deal Hunter

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - test

permissions:
  contents: write

concurrency:
  group: deal-hunter
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Deal Hunter script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python deal_hunter.py ${{ github.event.inputs.mode }}

      - name: Save seen deals
        if: always()
        continue-on-error: true
        run: |
          if [ -f seen_deals.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_deals.json
            if git diff --cached --quiet; then
              echo "no changes"
            else
              git commit -m "update seen deals"
              git pull --rebase
              git push
            fi
          fi
          
